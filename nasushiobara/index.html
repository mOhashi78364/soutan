.lang button.on{color:var(--ink);border-bottom-color:var(--ink)}

main{flex:1;padding:22px 0 18px}
.pg{display:none}.pg.on{display:block;animation:in .2s both}

.btn.sec{background:#fff;color:var(--ac)}
.rt{list-style:none;margin:0;padding:0}
.rt>li{display:block}
details.stop{border-bottom:1px solid var(--line)}

.tm{font-size:13px;color:var(--ac);font-weight:700;min-width:100px;font-variant-numeric:tabular-nums}
.hl{color:var(--hl)}
.nm{font-weight:700;font-size:16px}
.chev{margin-left:auto;color:var(--mut)}

.lnk{color:var(--ac);font-size:13px;text-decoration:underline;white-space:nowrap}

function gm(o,d,w,m){const e=encodeURIComponent;return 'https://www.google.com/maps/dir/?api=1&origin='+e(o)+'&destination='+e(d)+'&travelmode='+m+(w.length?'&waypoints='+w.map(e).join('%7C'):'')}

let M=null,pg=0,lastText='';

function renderTime(){const a=tm(st.arr),l=tm(st.leave);$('#avail').innerHTML=l-a>=60?tr('avail',hm(l-a-BUF),BUF):tr('short')}
function dayBlock(p,it,arr,leave,aq,dq,gid,head){
 const mode=st.car===0?'transit':'driving',sps=it.filter(o=>o.k==='sp'),
  stops=sps.filter(o=>o.x.a!=='eki').map(o=>pq(o.x,dq)).filter((q,i,a)=>q!==a[i-1]);
 const full=stops.length?(st.car===0?gm(aq,stops[0],[],mode):gm(aq,dq,stops,mode)):'';
 const used=new Set([...p.pk,...p.ex]),stay=[...used].reduce((m,x)=>m+x.st,0),dep=it[it.length-1],toLodge=p.sto[0]==='L';
 let h=`<div class="sum"><div><b>${used.size}</b><span>${tr('u1')}</span></div><div><b>${stay}</b><span>${tr('u2')}</span></div><div><b>${dep.slack}</b><span>${tr('u3')}</span></div></div>`;
 if(full)h+=`<div class="grp"><a class="btn" id="${gid}" href="${esc(full)}" target="_blank" rel="noopener">${IC.pin}${tr(st.car===0?'gmap1':'gmap')}</a>${st.car===0?'<p class="info">'+tr('gnote')+'</p>':''}</div>`;
 else h+=`<p class="info">${tr('nomap')}</p>`;
 h+='<ul class="rt">';let q0=aq,txt=head+'\n';
 it.forEach((o,i)=>{
  if(o.k==='mv'){const nx=it.slice(i+1).find(z=>z.k==='sp'),to=nx?pq(nx.x,dq):dq;
   h+=`<li class="mv"><span>${eh(o.txt)}</span><a class="lnk" href="${esc(gm(q0,to,[],mode))}" target="_blank" rel="noopener">${tr('leg')}</a></li>`}
  else if(o.k==='sp'){const x=o.x;q0=pq(x,dq);const ad=addr(x,st.lang),orig=st.lang!=='ja'&&pn(x)!==x.n[0]?'<br>'+eh(x.n[0]):'';
   h+=`<li><details class="stop"><summary><span class="tm">${fm(o.t)}–${fm(o.t+x.st)}</span><span class="nm">${eh(pn(x))}</span>${IC.chev}</summary><div class="dt">${an(x.a)} · ${tr('dur',x.st)}<br>${tr('n_'+x.c)}${ad?'<br>'+eh(ad):''}${orig}</div></details></li>`;
   txt+=fm(o.t)+' '+pn(x)+'（'+an(x.a)+(ad?' / '+ad:'')+'）\n'}
  else{const lab=toLodge?tr('cin',nm(p.sto)):tr('dep',nm(p.sto)).trim();
   h+=`<li class="dep"><span class="tm hl">${fm(o.t)}</span><span class="nm">${toLodge?IC.moon:IC.train}${eh(lab)}</span></li>`;txt+=fm(o.t)+' '+lab+'\n'}
 });
 return {h:h+'</ul>',txt:txt+(full?full+'\n':''),used,stay,slack:dep.slack};

function suggestLodges(la){
 const ar=LA[la]||la,pref=[ar,ar,'shio','ita','kuro','nishi'],seen=new Set(),out=[];
 pref.forEach(a=>{if(out.length>=3)return;const c=LD.find(x=>x.a===a&&x.t!=='camp'&&x.t!=='cottage'&&!seen.has(x.id));if(c){out.push(c);seen.add(c.id)}});
 LD.forEach(x=>{if(out.length<3&&!seen.has(x.id)&&x.t!=='camp'){out.push(x);seen.add(x.id)}});
 return out;
}
function renderRoute(){
 const arr=tm(st.arr),leave=tm(st.leave),box=$('#route');
 if(leave-arr<60){M=null;box.innerHTML='<p class="info">'+tr('short')+'</p>';return}
 const areas=st.areas.length?st.areas:null,head=tr('txth',fm(arr),fm(leave));
 const p0=plan(P,arr,leave,st.crowd,st.from,st.to,areas);
 let h='',d1,d2=null,sugg=[];
 const missedOf=used=>st.want.map(id=>PI[id]).filter(x=>x&&!used.has(x));
 if(!st.stay){
  const it=build(p0,arr,leave);d1=dayBlock(p0,it,arr,leave,SQ[st.from],SQ[st.to],'gmap',head);
  const left=P.filter(x=>!d1.used.has(x)&&x.a!=='eki'&&sc(x)>0).sort((a,b)=>sc(b)-sc(a)),pe=plan(left,540,960,0,st.from,st.from,null);
  M={p:p0,n1:d1.used.size,n2:pe.pk.length,left,pe,stay:0};
  const ms=missedOf(d1.used);
  h=d1.h.replace('<div class="grp">',(ms.length?`<p class="info">${eh(tr('wantMiss',ms.map(pn).join(', ')))}</p>`:'')+'<div class="grp">');
  h+=`<div class="grp"><p class="info">${tr('stayNote')}</p><button class="btn sec" id="stayon" style="margin-top:12px">${IC.moon}${tr('stayBtn')}</button></div>`;
  box.innerHTML=h;lastText=d1.txt+tr('ft');return;
 }
 const la=p0.c.length?p0.c[p0.c.length-1]:'kuro';sugg=suggestLodges(la);
 if(!LDI[st.lodge]){st.lodge=sugg[0].id;save()}
 const lod=LDI[st.lodge],lst=sugg.some(x=>x.id===lod.id)?sugg:[lod,...sugg.slice(0,2)];
 const p1=plan(P,arr,leave,st.crowd,st.from,'L:'+lod.a,areas),it1=build(p1,arr,leave);
 d1=dayBlock(p1,it1,arr,leave,SQ[st.from],lod.q,'gmap',head);
 const ms=missedOf(d1.used);
 h=`<h2>${tr('h_day1')}</h2>`+d1.h.replace('<div class="grp">',(ms.length?`<p class="info">${eh(tr('wantMiss',ms.map(pn).join(', ')))}</p>`:'')+'<div class="grp">');
 h+=`<div class="grp"><h2>${tr('h_lodge')}</h2><p class="info">${tr('lodge_hint')}</p>${lst.map(x=>{const ad=addr(x,st.lang);return `<button class="sg${x.id===lod.id?' on':''}" data-lodge="${x.id}">${eh(pn(x))}<small>${an(x.a)} · ${tr('l_'+x.t)}${ad?' · '+eh(ad):''}</small></button>`}).join('')}</div>`;

 else{
  const pool2=P.filter(x=>x.a==='eki'||!d1.used.has(x)),p2=plan(pool2,s2,l2,0,'L:'+lod.a,st.to,null),it2=build(p2,s2,l2);
  d2=dayBlock(p2,it2,s2,l2,lod.q,SQ[st.to],'gmap2',tr('h_day2')+' '+fm(s2)+' → '+fm(l2));
  h+=d2.h;txt+='\n'+d2.txt;n2=d2.used.size;

function renderSum(){
 const box=$('#sumBox');if(!M){box.innerHTML='';return}
 const {p,n1,n2}=M,tips=[];
 if(!p.c.length)tips.push(tr('tip0'));
 if(st.rain)tips.push(tr('tip1'));
 if(st.crowd&&p.c.includes('shio'))tips.push(tr('tip2'));
 if(st.car===0)tips.push(tr('tip3'));

function go(n,push){

document.addEventListener('click',e=>{
